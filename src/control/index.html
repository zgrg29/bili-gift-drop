<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title></title><link rel="stylesheet" href="/src/control/style.css"></head><body>
<header><div><span class="brand">✦</span><h1 data-t="title"></h1><p data-t="subtitle"></p></div><label><span data-t="language"></span><select id="language"><option value="zh-CN">简体中文</option><option value="ja">日本語</option><option value="en">English</option></select></label></header>
<main><aside><section><div class="section-head"><h2 data-t="room"></h2><span id="status" role="status"></span></div><form id="connection"><input id="room" inputmode="numeric" pattern="[0-9]{1,12}" required maxlength="12" aria-labelledby="room-label"><span id="room-label" class="sr" data-t="room"></span><div class="buttons"><button data-t="connect"></button><button type="button" class="secondary" id="disconnect" data-t="disconnect"></button></div></form><p class="notice" data-t="prototype"></p><p id="warning" role="status"></p></section>
<section><h2 data-t="settings"></h2><form id="settings"><p data-t="autosaveHint"></p><div id="fields"></div><p data-t="giftScaleHint"></p><p data-t="minGiftPriceHint"></p><label class="check"><input type="checkbox" id="includeFree"><span data-t="includeFree"></span></label><button data-t="save"></button></form></section>
<section><h2 data-t="obs"></h2><input id="obs" readonly aria-label="OBS URL"><div class="buttons"><button id="copy" data-t="copy"></button><a id="open" href="/overlay" target="_blank" data-t="open"></a></div><p data-t="guide"></p></section></aside>
<article><section><div class="section-head"><h2 data-t="preview"></h2><span class="live-dot">●</span></div><div class="preview"><iframe src="/overlay" title="OBS"></iframe></div><p data-t="previewHint"></p><form id="demo"><label><span data-t="count"></span><input id="count" type="number" min="1" max="1000" value="12" required></label><label><span data-t="price"></span><input id="price" type="number" min="0" max="100000" step="0.001" value="1" required></label><button data-t="test"></button><button type="button" class="secondary" id="clear" data-t="clear"></button></form></section><section><h2 data-t="events"></h2><p id="empty" data-t="empty"></p><ul id="events"></ul></section></article></main><div id="toast" role="status"></div><script type="module" src="/src/control/control.mjs"></script></body></html>
